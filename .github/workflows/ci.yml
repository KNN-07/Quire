name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Capability mapping
        run: bun run verify:matrix
      - name: Dependency audit
        run: bun audit --audit-level=high
      # Suites that need a TeX toolchain, Docker images or a browser run locally.
      - name: Contract tests
        run: bun test --timeout 60000 tests/contract tests/ui-editor/tools/python-isolation.test.ts
