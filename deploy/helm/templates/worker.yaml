{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, quire-role: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, quire-role: worker}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: compiler
          image: {{ required "A verified confined remote worker image is required" .Values.worker.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [worker]
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: QUIRE_COORDINATOR_URL, value: "http://{{ .Release.Name }}-api:8080"}
            - name: QUIRE_WORKER_ENVIRONMENT_IDS
              value: {{ required "Set verified worker environment IDs" .Values.worker.environmentIds | quote }}
{{- end }}
