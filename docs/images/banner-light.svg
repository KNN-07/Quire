<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Quire</title>
  <desc id="d">Write LaTeX together. Version it like code. A self-hosted LaTeX workspace with shared editing, real PDF compilation, review, and Git history.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="420" rx="20"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#16181D" stroke-opacity="0.05"/></pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="gridmask"><rect width="1280" height="420" fill="url(#fade)"/></mask>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#F6F7F9"/>
    <rect width="1280" height="420" fill="url(#grid)" mask="url(#gridmask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="19.5" fill="none" stroke="#E3E5EA"/>
  <g transform="translate(64 60) scale(0.6875)" fill="none" stroke="#2F4FD6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 9H27C16 9 9 17 9 29v6c0 12 8 20 20 20h5c12 0 20-8 20-20V21L42 9Z" stroke-width="6"/>
    <path d="M41 10v13h12M34 39l21 18" stroke-width="6"/>
    <path d="M22 26h9M22 35h9" stroke-width="4"/>
  </g>
  <text x="122" y="92" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="#16181D">Quire</text>
  <text font-family="Georgia,'Times New Roman',Times,serif" font-size="52" fill="#16181D"><tspan x="64" y="172">Write LaTeX together.</tspan><tspan x="64" y="230">Version it like code.</tspan></text>
  <text font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#4A505E"><tspan x="64" y="276">A self-hosted LaTeX workspace with shared editing,</tspan><tspan x="64" y="304">real PDF compilation, review, and Git history.</tspan></text>
  <rect x="64" y="336" width="118" height="32" rx="16" fill="#FFFFFF" stroke="#E3E5EA"/><text x="123.0" y="357" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#4A505E">Self-hosted</text><rect x="192" y="336" width="96" height="32" rx="16" fill="#FFFFFF" stroke="#E3E5EA"/><text x="240.0" y="357" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#4A505E">Real Git</text><rect x="298" y="336" width="168" height="32" rx="16" fill="#FFFFFF" stroke="#E3E5EA"/><text x="382.0" y="357" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#4A505E">Sandboxed compile</text><rect x="476" y="336" width="138" height="32" rx="16" fill="#FFFFFF" stroke="#E3E5EA"/><text x="545.0" y="357" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#4A505E">AI with review</text>
  <rect x="754" y="62" width="470" height="296" rx="14" fill="#FFFFFF" stroke="#E3E5EA"/>
  <path d="M754 98h470M754 294h470" stroke="#E3E5EA"/>
  <circle cx="773" cy="80" r="5" fill="#D5D8DF"/><circle cx="789" cy="80" r="5" fill="#D5D8DF"/><circle cx="805" cy="80" r="5" fill="#D5D8DF"/>
  <text x="989" y="84" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#6B7280">main.tex</text>
  <text x="778" y="136" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#16181D"><tspan fill="#3446B8">\section</tspan>{Method}</text><text x="778" y="162" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#16181D">Let <tspan fill="#0E6E66">$z_t$</tspan> denote the latent state.</text><text x="778" y="188" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#16181D"><tspan fill="#3446B8">\begin</tspan>{equation}</text><text x="778" y="214" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#16181D"><tspan fill="#0E6E66">  z_{t+1} = f_\theta(z_t, a_t)</tspan></text><text x="778" y="240" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#16181D"><tspan fill="#3446B8">\end</tspan>{equation}</text><text x="778" y="266" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#16181D"><tspan fill="#6B7280">% edit, compile, review</tspan></text>
  <text x="989" y="334" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-style="italic" font-size="24" fill="#4A505E">z<tspan dy="7" font-size="15">t+1</tspan><tspan dy="-7" dx="2" font-size="24">​</tspan> = f<tspan dy="7" font-size="15">θ</tspan><tspan dy="-7" dx="2" font-size="24">​</tspan>(z<tspan dy="7" font-size="15">t</tspan><tspan dy="-7" dx="2" font-size="24">​</tspan>, a<tspan dy="7" font-size="15">t</tspan><tspan dy="-7" dx="2" font-size="24">​</tspan>)</text>
</svg>
